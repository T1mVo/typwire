[workspace]
members = ["crates/*"]
# `typwire-tests-plugin` is a wasm-only cdylib; it cannot link for the host
# target, so keep it out of the default set built by a bare `cargo build`/`cargo
# test`. Build it explicitly with `-p typwire-tests-plugin --target
# wasm32-unknown-unknown` (see `scripts/test.py`).
default-members = ["crates/typwire", "crates/typwire-macros"]
resolver = "2"

[workspace.dependencies]
typwire-macros = { path = "crates/typwire-macros", version = "0.3.0" }

cbor4ii = { version = "1.2.3", features = ["serde1", "use_std", "half-f16"] }
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex-lite = "0.1.9"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.4", features = ["full", "visit"] }
thiserror = "2.0.17"
wasm-minimal-protocol = "0.1.0"

[workspace.dev-dependencies]
trybuild = "1.0.114"

# Applies workspace-wide (Cargo has no way to scope `lto` to one package),
# so a `--release` build of `typwire`/`typwire-macros` for the host is also
# affected, not just `typwire-tests-plugin`'s wasm build -- worth knowing if
# anything ever runs `cargo build --release`/`cargo test --release` here;
# the documented commands (`cargo test`, `cargo build`) use the untouched
# `dev` profile.
[profile.release]
lto = true
codegen-units = 1
strip = true
# `opt-level = "z"` and `panic = "abort"` were both tried here and removed:
# `opt-level = "z"` was the single biggest size lever (raw wasm 2,686 KiB ->
# 1,464 KiB) but also the only setting in this profile that measurably slowed
# down actual test *execution*, not just build output size (~5.8s -> ~7.8s
# for the full suite) -- see CLAUDE.md's *Testing* section for the full
# before/after. `panic = "abort"` made no measurable difference either way
# for this wasm target, which can't unwind regardless of this setting.
