[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
typwire-macros = { path = "crates/typwire-macros", version = "0.2.0" }

ciborium = "0.2.2"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "3.0.4", features = ["full", "visit"] }
thiserror = "2.0.17"
wasm-minimal-protocol = "0.1.0"

[workspace.dev-dependencies]
trybuild = "1.0.114"
