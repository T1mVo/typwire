[workspace]
members = ["crates/*"]
default-members = ["crates/typwire", "crates/typwire-macros"]
resolver = "2"

[workspace.dependencies]
typwire-macros = { path = "crates/typwire-macros", version = "0.2.0" }

cbor4ii = { version = "1.2.3", features = ["serde1", "use_std", "half-f16"] }
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
regex-lite = "0.1.9"
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "3.0.4", features = ["full", "visit"] }
thiserror = "2.0.17"
wasm-minimal-protocol = "0.1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
