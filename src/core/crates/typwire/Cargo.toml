[package]
name = "typwire"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Tim Voßhenrich"]
description = "Typed data exchange for Typst plugins."
readme = "README.md"
repository = "https://github.com/T1mVo/typwire"
license = "MIT OR Apache-2.0"
keywords = ["typst", "typing", "wasm", "plugin"]
categories = ["data-structures", "encoding", "wasm"]
exclude = ["example", "test", "scripts", "src-typst"]

[features]
# Backs the Typst `decimal` type with a `rust_decimal::Decimal` -- the same
# crate Typst's own `decimal` type wraps internally. Without it, `Decimal`
# (and `Any::Decimal`) don't exist at all -- see
# `src/foundations/decimal.rs`.
decimal = ["dep:rust_decimal"]
# Backs the Typst `regex` type with a compiled `regex_lite::Regex`. Without
# it, `Regex` (and `Any::Regex`) don't exist at all -- see
# `src/foundations/regex.rs`.
regex = ["dep:regex-lite"]
# Enables the `Json` wire format (`#[typwire::export(format = "json")]` /
# Typst's `typwire.json`), backed by `serde_json`. Without it, `Json`
# doesn't exist at all -- see `src/format/json.rs`.
json = ["dep:serde_json"]
# Enables the `Yaml` wire format, backed by `serde-saphyr`. Without it,
# `Yaml` doesn't exist at all -- see `src/format/yaml.rs`.
yaml = ["dep:serde-saphyr"]
# Enables the `Toml` wire format, backed by the `toml` crate. Without it,
# `Toml` doesn't exist at all -- see `src/format/toml.rs`. TOML's own
# grammar requires a top-level table, so this format only works for
# struct/dictionary-shaped `Typwire` values, not bare primitives or arrays.
toml = ["dep:toml"]

[dependencies]
typwire-macros.workspace = true

cbor4ii.workspace = true
regex-lite = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde.workspace = true
serde-saphyr = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
toml = { workspace = true, optional = true }
wasm-minimal-protocol.workspace = true
